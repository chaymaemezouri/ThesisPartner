services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thesispartner
      POSTGRES_PASSWORD: thesispartner
      POSTGRES_DB: thesispartner
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U thesispartner -d thesispartner']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - thesispartner

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - thesispartner

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ['mail']
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - thesispartner

  s3:
    image: chrislusf/seaweedfs:4.00
    entrypoint: ['/usr/bin/weed', '-logtostderr=true']
    command:
      - server
      - -dir=/data
      - -volume.max=16
      - -master.volumeSizeLimitMB=32
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '9000:8333'
    volumes:
      - s3_data:/data
      - ./infrastructure/docker/s3/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - thesispartner

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:8080
      API_PORT: 3000
      DATABASE_URL: postgresql://thesispartner:thesispartner@postgres:5432/thesispartner?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      TRUST_PROXY: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_SECURE: 'false'
      SMTP_FROM: "Thesis Flow <noreply@thesispartner.local>"
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_URL: http://localhost:8080
      S3_REGION: us-east-1
      S3_BUCKET: thesispartner
      S3_ACCESS_KEY: thesispartner
      S3_SECRET_KEY: thesispartner-secret
      S3_FORCE_PATH_STYLE: 'true'
      SIGNED_URL_TTL_SECONDS: '300'
      MAX_UPLOAD_SIZE_MB: '50'
      FILE_SCAN_MODE: allow
      PAYMENT_PROVIDER: none
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      s3:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>r.json()).then((b)=>process.exit(b.checks&&b.checks.database==='ok'&&b.checks.redis==='ok'&&b.checks.storage==='ok'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - thesispartner

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'
    networks:
      - thesispartner

networks:
  thesispartner:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  s3_data:
