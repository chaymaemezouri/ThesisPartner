name: Deploy Thesis Flow

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: thesispartner-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:packages
      - run: npm exec -w @thesispartner/api -- prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Validate production Compose
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config >/dev/null
        env:
          APP_URL: https://example.invalid
          SMTP_HOST: smtp.example.invalid
          SMTP_FROM: Thesis Flow <noreply@example.invalid>
          S3_PUBLIC_URL: https://example.invalid
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci-secret-value

  deploy:
    name: Deploy to Hostinger
    needs: validate
    if: ${{ vars.THESIS_APP_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Configure secure SSH
        env:
          DEPLOY_HOST: ${{ secrets.THESIS_DEPLOY_HOST }}
          HOST_PUBLIC_KEY: ${{ secrets.THESIS_DEPLOY_HOST_PUBLIC_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.THESIS_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/thesispartner_deploy
          chmod 600 ~/.ssh/thesispartner_deploy

          printf '%s %s\n' "$DEPLOY_HOST" "$HOST_PUBLIC_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/thesispartner_deploy > /dev/null
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts

      - name: Require public health URL
        env:
          APP_URL: ${{ vars.THESIS_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "Set GitHub Actions variable THESIS_APP_URL to the public origin" >&2
            exit 1
          fi

      - name: Deploy exact commit
        env:
          DEPLOY_HOST: ${{ secrets.THESIS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.THESIS_DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/thesispartner_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $DEPLOY_SHA"

      - name: Verify production health including storage
        env:
          APP_URL: ${{ vars.THESIS_APP_URL }}
        run: |
          set -euo pipefail
          url="${APP_URL%/}/api/v1/health"
          body=""
          for i in $(seq 1 24); do
            if body="$(curl -fsS --max-time 20 "$url")"; then
              break
            fi
            sleep 5
          done
          if [ -z "$body" ]; then
            echo "public health URL did not respond" >&2
            exit 1
          fi
          BODY="$body" python3 -c 'import json,os,sys;c=(json.loads(os.environ["BODY"]).get("checks") or {});m=[n for n in ("database","redis","storage") if c.get(n)!="ok"];sys.exit("health checks failed: "+",".join(m) if m else 0)'
          echo "public health ok"

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/thesispartner_deploy
