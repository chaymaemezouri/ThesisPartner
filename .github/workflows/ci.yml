name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thesispartner
          POSTGRES_PASSWORD: thesispartner
          POSTGRES_DB: thesispartner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thesispartner -d thesispartner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: thesispartner
      S3_ACCESS_KEY: thesispartner
      S3_SECRET_KEY: thesispartner-secret
      NODE_ENV: test
      APP_URL: http://localhost:5173
      API_PORT: 3000
      DATABASE_URL: postgresql://thesispartner:thesispartner@localhost:5432/thesispartner?schema=public
      TEST_DATABASE_URL: postgresql://thesispartner:thesispartner@localhost:5432/thesispartner_test?schema=public
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      TRUST_PROXY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - name: Start test S3
        run: |
          docker run -d --name thesispartner-ci-minio \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=thesispartner \
            -e MINIO_ROOT_PASSWORD=thesispartner-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs thesispartner-ci-minio
          exit 1
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e -w @thesispartner/web
