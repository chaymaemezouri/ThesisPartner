name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thesispartner
          POSTGRES_PASSWORD: thesispartner
          POSTGRES_DB: thesispartner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thesispartner -d thesispartner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NODE_ENV: test
      APP_URL: http://localhost:5173
      API_PORT: 3000
      DATABASE_URL: postgresql://thesispartner:thesispartner@localhost:5432/thesispartner?schema=public
      TEST_DATABASE_URL: postgresql://thesispartner:thesispartner@localhost:5432/thesispartner_test?schema=public
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      TRUST_PROXY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e -w @thesispartner/web
